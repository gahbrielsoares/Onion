<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contas · Onion Park</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600;700;800&family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1424;--muted:#5d5268;--line:#e8dfd3;--purple:#7A2E8E;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:#FBF7F1;color:var(--ink);font:15px/1.5 Figtree,system-ui,sans-serif}
main{width:min(1180px,100% - 32px);margin:0 auto;padding:32px 0 60px}
h1{font:800 32px/1.1 "Bricolage Grotesque",Figtree,sans-serif;letter-spacing:-.02em;margin:0}
.px{font-family:"Pixelify Sans",monospace;color:var(--purple)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.btn{font:800 14px Figtree,sans-serif;padding:9px 14px;border-radius:11px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.st{background:#fff;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);border-radius:14px;padding:12px 14px}
.st b{display:block;font:800 28px "Bricolage Grotesque",Figtree,sans-serif}.st span{color:var(--muted);font-size:13px}
.tools{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.tools input{flex:1;min-width:200px;font:15px Figtree,sans-serif;padding:9px 12px;border:2px solid #d9cfc2;border-radius:11px}
.wrapt{overflow-x:auto;background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink)}
table{width:100%;border-collapse:collapse;min-width:820px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#faf6ef;cursor:pointer;position:sticky;top:0}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
.on{background:#e7f6ec;color:#1d5b33}.off{background:#f1ece6;color:#6d6377}.new{background:#f3e8f7;color:#7A2E8E}
.msg{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:18px;box-shadow:3px 3px 0 var(--ink)}
@media (max-width:700px){.stats{grid-template-columns:1fr 1fr}}
</style></head>
<body><main>
<div class="top"><h1>Contas do <span class="px">Onion Park</span></h1><div><button class="btn" id="csv" hidden>⬇ Baixar CSV</button> <button class="btn" id="out" hidden>Sair</button></div></div>
<div id="root"><div class="msg">Carregando…</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/config.js?v=202611141053"></script>
<script src="assets/auth.js?v=202611141053"></script>
<script>
const root = document.getElementById("root"), esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = d => d ? new Date(d).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";
const ago = d => { if (!d) return "nunca"; const m = (Date.now() - new Date(d)) / 60000; return m < 60 ? `há ${Math.round(m)} min` : m < 1440 ? `há ${Math.round(m / 60)} h` : `há ${Math.round(m / 1440)} dias`; };
let rows = [], sortK = "last_seen_at", sortDir = -1, filter = "";
async function start() {
  if (!Auth.enabled) { root.innerHTML = `<div class="msg">O cadastro ainda não está ligado. Siga o guia <b>docs/CONFIGURAR-CADASTRO.md</b> e preencha <b>assets/config.js</b>.</div>`; return; }
  const s = await Auth.state();
  if (!s.user) { Auth.open({ step: "login", blocking: true, onDone: start }); root.innerHTML = `<div class="msg">Entre com a conta de administrador.</div>`; return; }
  const { data: adm } = await Auth.sb.from("admins").select("email").eq("email", s.user.email).maybeSingle();
  document.getElementById("out").hidden = false;
  if (!adm) { root.innerHTML = `<div class="msg">A conta <b>${esc(s.user.email)}</b> não é administradora. Adicione esse e-mail na tabela <b>admins</b> do Supabase.</div>`; return; }
  const { data, error } = await Auth.sb.from("profiles").select("*").order("created_at", { ascending: false });
  if (error) { root.innerHTML = `<div class="msg">Erro: ${esc(error.message)}</div>`; return; }
  const { data: subs } = await Auth.sb.from("subscriptions").select("*");
  const bySub = Object.fromEntries((subs || []).map(x => [x.user_id, x]));
  rows = (data || []).map(r => { const x = bySub[r.id]; return { ...r, plano: x ? x.status : "", access_until: x ? x.access_until : null }; });
  document.getElementById("csv").hidden = false; draw();
}
function draw() {
  const now = Date.now(), d7 = 7 * 864e5, act = rows.filter(r => r.last_seen_at && now - new Date(r.last_seen_at) < d7).length, today = rows.filter(r => now - new Date(r.created_at) < 864e5).length;
  let list = rows.filter(r => !filter || (r.email || "").toLowerCase().includes(filter) || (r.phone || "").includes(filter));
  list.sort((a, b) => { const x = a[sortK] ?? "", y = b[sortK] ?? ""; return (x > y ? 1 : x < y ? -1 : 0) * sortDir; });
  const th = (k, t) => `<th data-k="${k}">${t}${sortK === k ? (sortDir > 0 ? " ▲" : " ▼") : ""}</th>`;
  root.innerHTML = `<div class="stats"><div class="st"><b>${rows.length}</b><span>contas cadastradas</span></div><div class="st"><b>${act}</b><span>usaram nos últimos 7 dias</span></div><div class="st"><b>${rows.reduce((a, r) => a + (r.videos || 0) + (r.stories || 0), 0)}</b><span>vídeos e stories feitos</span></div><div class="st"><b>${rows.filter(r => r.plano === "authorized").length}</b><span>assinantes ativos</span></div></div>
  <div class="tools"><input id="q" placeholder="Buscar por e-mail ou telefone" value="${esc(filter)}"></div>
  <div class="wrapt"><table><thead><tr>${th("email", "E-mail")}${th("phone", "Telefone")}${th("created_at", "Cadastro")}${th("last_seen_at", "Último uso")}<th>Status</th>${th("plano", "Assinatura")}${th("opens", "Aberturas")}${th("projects", "Projetos")}${th("videos", "Vídeos")}${th("stories", "Stories")}</tr></thead><tbody>
  ${list.map(r => { const active = r.last_seen_at && now - new Date(r.last_seen_at) < d7, fresh = !r.last_seen_at;
    return `<tr><td>${esc(r.email)}</td><td>${r.phone ? `<a href="https://wa.me/${esc(String(r.phone).replace(/\D/g, ""))}" target="_blank" rel="noopener">${esc(r.phone)}</a>` : "—"}</td><td>${fmt(r.created_at)}</td><td>${fmt(r.last_seen_at)}<br><small style="color:var(--muted)">${ago(r.last_seen_at)}</small></td>
      <td><span class="tag ${fresh ? "new" : active ? "on" : "off"}">${fresh ? "nunca abriu" : active ? "ativo" : "parado"}</span></td><td>${({ authorized: '<span class="tag on">ativa</span>', cancelled: '<span class="tag off">cancelada</span>', paused: '<span class="tag off">pausada</span>', pending: '<span class="tag new">pendente</span>' })[r.plano] || "—"}</td><td class="n">${r.opens || 0}</td><td class="n">${r.projects || 0}</td><td class="n">${r.videos || 0}</td><td class="n">${r.stories || 0}</td></tr>`; }).join("") || `<tr><td colspan="10">Nenhuma conta ainda.</td></tr>`}
  </tbody></table></div>`;
  const q = document.getElementById("q"); q.oninput = () => { filter = q.value.trim().toLowerCase(); const pos = q.selectionStart; draw(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos); };
  root.querySelectorAll("th[data-k]").forEach(t => t.onclick = () => { const k = t.dataset.k; if (sortK === k) sortDir *= -1; else { sortK = k; sortDir = -1; } draw(); });
}
document.getElementById("out").onclick = async () => { await Auth.signOut(); location.reload(); };
document.getElementById("csv").onclick = () => {
  const head = ["email", "telefone", "cadastro", "ultimo_uso", "assinatura", "aberturas", "projetos", "videos", "stories"];
  const lines = [head.join(";"), ...rows.map(r => [r.email, r.phone, r.created_at, r.last_seen_at, r.plano, r.opens, r.projects, r.videos, r.stories].map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(";"))];
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" })); a.download = "onion-contas.csv"; a.click();
};
start();
</script>
</body></html>
