<script>
/* "Ver como funciona" (?demo=1): a demonstração usa um armazenamento separado e começa sempre do zero */
(function(){ var d=/[?&]demo=1\b/.test(location.search); window.ONION_DEMO=d; if(!d) return;
  try{ var P="onion-demo:", ls=window.localStorage, SP=Storage.prototype, g=SP.getItem, s=SP.setItem, r=SP.removeItem;
    for(var i=ls.length-1;i>=0;i--){ var k=ls.key(i); if(k&&k.indexOf(P)===0) r.call(ls,k); }
    SP.getItem=function(k){ return g.call(this,this===ls?P+k:k); }; SP.setItem=function(k,v){ return s.call(this,this===ls?P+k:k,v); }; SP.removeItem=function(k){ return r.call(this,this===ls?P+k:k); };
  }catch(e){}
  try{ indexedDB.deleteDatabase("onion-demo-media"); var o=indexedDB.open.bind(indexedDB); indexedDB.open=function(n,v){ return o(n==="onion-media"?"onion-demo-media":n,v); }; }catch(e){}
})();
</script>
